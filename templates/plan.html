<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Predbat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script>
      window.__PLAN_DATASETS__ = {{ datasets | tojson }};
      window.__SELECTED_KEY__ = {{ selected_key | tojson }};
      window.__SOURCE_URL__ = {{ source_url | tojson }};
      window.__REFRESH_INTERVAL_MS__ = {{ refresh_interval_ms | tojson }};
    </script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <div class="bg-shape bg-shape-one"></div>
    <div class="bg-shape bg-shape-two"></div>

    <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
    </button>

    <main class="layout">
      <header class="hero">
        <div class="hero-eyebrow">
          <p class="eyebrow">Predbat Planner</p>
          <p class="eyebrow eyebrow-version">v{{ version }}</p>
        </div>
        <div class="hero-status">
          <span id="refreshStatus" class="status-badge status-ok">Live</span>
          <span id="refreshTime"></span>
        </div>
        <h1>Dashboard</h1>
        <p class="subtitle">Your battery, solar, and grid activity in one place.</p>
      </header>

      {% if error %}
        <section class="error-panel">
          <h2>Data Fetch Error</h2>
          <p>{{ error }}</p>
          <p>Source URL: {{ source_url }}</p>
        </section>
      {% else %}
        <section class="toolbar">
          <div class="tabs" id="tabs"></div>
          <div class="hero-battery" id="heroBattery"></div>
          <div class="cards" id="summaryCards"></div>
        </section>

        <section class="charts-section">
          <div class="charts-header">
            <h2>Charts</h2>
            <button type="button" id="chartsToggle" class="refresh-btn charts-toggle" aria-expanded="true" aria-label="Toggle charts">▲</button>
          </div>
          <div class="charts" id="chartsContainer">
            <article class="panel panel-wide">
              <h2>PV Vs Load</h2>
              <div class="chart-shell chart-shell-tall">
                <canvas id="energyChart" aria-label="PV and load chart" role="img"></canvas>
              </div>
            </article>
          </div>
        </section>

        <section class="panel table-wrap" id="tableWrap">
          <h2>Plan detail</h2>
          <div class="state-legend" id="stateLegend"></div>
          <div class="table-fade table-fade-top" aria-hidden="true"></div>
          <div class="table-fade table-fade-bottom" aria-hidden="true"></div>
          <div class="table-scroll" id="tableScroll">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Import</th>
                  <th>Export</th>
                  <th>State</th>
                  <th>Limit</th>
                  <th>PV</th>
                  <th>Load</th>
                  <th>SoC</th>
                  <th>Cost</th>
                  <th>Total Cost</th>
                </tr>
              </thead>
              <tbody id="planRows"></tbody>
            </table>
          </div>
        </section>
      {% endif %}
    </main>
  </body>
</html>
