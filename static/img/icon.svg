<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Predbat Planner">
  <!-- Background tile with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#12263a"/>

  <!-- Battery body -->
  <rect x="13" y="20" width="32" height="24" rx="4" ry="4"
        fill="none" stroke="#f4efe6" stroke-width="3"/>
  <!-- Battery terminal -->
  <rect x="46" y="27" width="5" height="10" rx="1.5" ry="1.5" fill="#f4efe6"/>

  <!-- Fill (green = healthy charge) -->
  <rect x="16" y="23" width="18" height="18" rx="2" ry="2" fill="#22c55e"/>

  <!-- Lightning bolt overlay -->
  <path d="M30 14 L24 32 L31 32 L27 50 L40 28 L33 28 L37 14 Z"
        fill="#ffba66" stroke="#ff7a18" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
